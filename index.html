    html, body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f0f4f8;
      color: #1e293b;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* iPhone Safari 入力ズーム防止（16px必須） */
    input, select, textarea {
      font-size: 16px !important;
    }

    /* セーフエリア（ノッチ・ホームバー）対応 */
    .safe-top-header {
      padding-top: calc(1rem + env(safe-area-inset-top));
    }
    .safe-bottom-body {
      padding-bottom: calc(5.5rem + env(safe-area-inset-bottom));
    }
    .safe-bottom-toast {
      bottom: calc(1.25rem + env(safe-area-inset-bottom));
    }

    /* 学術ネイビー×ブルーテーマ */
    .navy-header {
      background: linear-gradient(135deg, #1b365d 0%, #142947 100%);
    }
    .blue-day-banner {
      background: linear-gradient(90deg, #0077c8 0%, #1a8cd8 100%);
    }

    /* 長文折り返し */
    .wrap-anywhere {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* チェック完了時の打ち消し線アニメーション */
    .todo-label {
      position: relative;
      transition: color 0.25s ease;
    }
    .todo-row.is-done .todo-label {
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
      text-decoration-color: #94a3b8;
      color: #94a3b8;
    }
    .todo-row.is-done .todo-body {
      opacity: 0.72;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

        id: 'd3-eigo-1',
        section: 'day3',
        subject: '英語コミュニケーションⅠ',
        text: 'Crown English CommunicationⅠ Lesson 5・6',
        completed: false
      },
      {
        id: 'd3-eigo-2',
        section: 'day3',
        subject: '英語コミュニケーションⅠ',
        text: 'O. Henry『The Church with an Overshot-Wheel』',
        completed: false
      },
      {
        id: 'd3-eigo-3',
        section: 'day3',
        subject: '英語コミュニケーションⅠ',
        text: 'Oscar Wilde『The Selfish Giant』',
        completed: false
      },
      {
        id: 'd3-eigo-4',
        section: 'day3',
        subject: '英語コミュニケーションⅠ',
        text: 'ターゲット Section 1～14（単語 No.1～1400）',
        completed: false
      },
      {
        id: 'd3-eigo-5',
        section: 'day3',
        subject: '英語コミュニケーションⅠ',
        text: 'Listening・応用問題（長文読解）',
        completed: false
      }
    ];

    const STORAGE_KEY = 'teiki_kousa_3rd_2026_todos_v2';
    let todos = [];
    let activeFilter = 'all';
    let toastTimer = null;

    /**
     * localStorage から読み込み、既存のチェック状態＆カスタム項目を維持したまま最新定義と同期する
     */
    function loadTodos() {
      let savedList = [];
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            savedList = parsed;
          }
        }
      } catch (err) {
        console.warn('localStorage load error:', err);
      }

      // 既存のチェック状態を ID ごとにマップ化
      const completedMap = new Map();
      const customItems = [];
      savedList.forEach(item => {
        if (item && typeof item.id === 'string') {
          completedMap.set(item.id, Boolean(item.completed));
          if (item.id.startsWith('custom-')) {
            customItems.push(item);
          }
        }
      });

      // 標準リストに過去のチェック状態を引き継ぐ
      const mergedDefaults = INITIAL_TODOS.map(item => ({
        ...item,
        completed: completedMap.has(item.id) ? completedMap.get(item.id) : false
      }));

      return [...mergedDefaults, ...customItems];
    }

    /**
     * localStorage へ保存
     */
    function saveTodos() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch (err) {
        console.warn('localStorage save error:', err);
      }
    }

    /**
     * トースト表示
     */
    function showToast(message) {
      const toastEl = document.getElementById('toast');
      if (!toastEl) return;
      toastEl.textContent = message;
      toastEl.classList.remove('opacity-0');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.add('opacity-0');
      }, 2000);
    }

    /**
     * リアルタイム自動カウントダウン（当日0時基準比較）
     */
    function updateCountdown() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const examStart = new Date(2026, 10, 18); // 2026年11月18日
      const examEnd = new Date(2026, 10, 20);   // 2026年11月20日

      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      const dateLabel = document.getElementById('today-date-label');
      if (dateLabel) {
        dateLabel.textContent = `今日：${now.getMonth() + 1}月${now.getDate()}日(${weekdays[now.getDay()]})`;
      }

      const diffDays = Math.round((examStart - today) / (1000 * 60 * 60 * 24));
      const badge = document.getElementById('countdown-badge');
      const textEl = document.getElementById('countdown-text');
      if (!badge || !textEl) return;

      if (diffDays > 0) {
        textEl.textContent = `考査初日（11/18）まで あと ${diffDays} 日！`;
        badge.style.backgroundColor = '#e11d48';
      } else if (today <= examEnd) {
        const examDay = Math.abs(diffDays) + 1;
        textEl.textContent = `🔥 第3回 定期考査 ${examDay}日目 実施中！`;
        badge.style.backgroundColor = '#d97706';
      } else {
        textEl.textContent = `🎉 第3回 定期考査 お疲れ様でした！`;
        badge.style.backgroundColor = '#059669';
      }
    }

    /**
     * 全体進捗バー更新
     */
    function updateProgress() {
      const total = todos.length;
      const completed = todos.filter(item => item.completed).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

      document.getElementById('completed-count').textContent = completed;
      document.getElementById('total-count').textContent = total;
      document.getElementById('progress-percent').textContent = `${percent}%`;
      document.getElementById('progress-bar').style.width = `${percent}%`;
    }

    /**
     * HTMLエスケープ
     */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /**
     * バッジ描画
     */
    function renderBadge(item) {
      if (!item.badge) return '';
      if (item.badgeStyle === 'urgent') {
        return `<span class="inline-block bg-rose-100 text-rose-700 border border-rose-200 text-[11px] font-extrabold px-2 py-0.5 rounded-md shrink-0">${escapeHtml(item.badge)}</span>`;
      }
      if (item.badgeStyle === 'warn') {
        return `<span class="inline-block bg-amber-100 text-amber-800 border border-amber-300 text-[11px] font-bold px-2 py-0.5 rounded-md shrink-0">${escapeHtml(item.badge)}</span>`;
      }
      return `<span class="inline-block bg-sky-100 text-sky-700 border border-sky-200 text-[11px] font-bold px-2 py-0.5 rounded-md shrink-0">${escapeHtml(item.badge)}</span>`;
    }

    /**
     * 1行分のTODOカード生成
     */
    function renderTodoRow(item) {
      const isCustom = item.id.startsWith('custom-');
      const doneClass = item.completed
        ? 'is-done bg-slate-50 border-slate-200/80'
        : 'bg-white border-slate-200 hover:border-[#0077c8]';
      const subBorder = !item.completed && item.section === 'submission'
        ? 'border-amber-300/90 hover:border-amber-500'
        : '';

      return `
        <div
          class="todo-row flex items-start gap-3 p-3 min-h-[52px] rounded-xl border transition-all cursor-pointer select-none ${doneClass} ${subBorder}"
          data-id="${escapeHtml(item.id)}"
          role="checkbox"
          aria-checked="${item.completed ? 'true' : 'false'}"
          tabindex="0"
        >
          <div class="pt-0.5 shrink-0">
            <div class="w-6 h-6 rounded-lg flex items-center justify-center border-2 transition-colors ${
              item.completed
                ? 'bg-[#0077c8] border-[#0077c8] text-white'
                : 'bg-white border-slate-300'
            }">
              ${
                item.completed
                  ? `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`
                  : ''
              }
            </div>
          </div>

          <div class="todo-body flex-1 min-w-0">
            ${
              item.section === 'submission' || item.badge
                ? `<div class="flex flex-wrap items-center gap-1.5 mb-1">
                    ${
                      item.section === 'submission'
                        ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700">${escapeHtml(item.subject)}</span>`
                        : ''
                    }
                    ${renderBadge(item)}
                  </div>`
                : ''
            }
            <p class="todo-label wrap-anywhere text-sm font-medium text-slate-800 leading-relaxed">
              ${escapeHtml(item.text)}
            </p>
          </div>

          ${
            isCustom
              ? `<button
                  type="button"
                  data-delete-id="${escapeHtml(item.id)}"
                  aria-label="追加したTODOを削除"
                  class="delete-btn min-w-[36px] min-h-[36px] -mr-1 -mt-0.5 flex items-center justify-center rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 font-bold text-sm shrink-0 transition"
                >✕</button>`
              : ''
          }
        </div>
      `;
    }

    /**
     * リスト全体描画
     */
    function render() {
      updateProgress();
      const container = document.getElementById('todo-container');
      if (!container) return;

      const filtered = todos.filter(item => {
        if (activeFilter === 'incomplete') return !item.completed;
        if (activeFilter === 'submission') return item.section === 'submission';
        if (activeFilter === 'day1') return item.section === 'day1';
        if (activeFilter === 'day2') return item.section === 'day2';
        if (activeFilter === 'day3') return item.section === 'day3';
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-slate-200 shadow-xs">
            <div class="text-3xl mb-2">🎉</div>
            <p class="text-sm font-extrabold text-[#1b365d]">表示するTODOはありません</p>
            <p class="text-xs text-slate-500 mt-1">すべて完了済みか、選択したフィルターに一致する項目がありません。</p>
          </div>
        `;
        return;
      }

      let html = '';

      // 1. 【提出課題・注意事項】セクション
      const subItems = filtered.filter(i => i.section === 'submission');
      if (subItems.length > 0) {
        const subDone = subItems.filter(i => i.completed).length;
        html += `
          <section class="bg-[#fffbeb] rounded-2xl p-3.5 sm:p-4 border-2 border-amber-400 shadow-xs">
            <div class="flex items-center justify-between gap-2 mb-3">
              <h2 class="text-sm sm:text-base font-extrabold text-amber-950 flex items-center gap-1.5">
                <span>🚨</span> 提出課題・注意事項
              </h2>
              <span class="text-xs font-extrabold text-amber-900 bg-amber-200/80 px-2.5 py-0.5 rounded-full shrink-0">
                ${subDone} / ${subItems.length} 完了
              </span>
            </div>
            <div class="space-y-2">
              ${subItems.map(renderTodoRow).join('')}
            </div>
          </section>
        `;
      }

      // 2. 日程別セクション（1日目〜3日目）
      const dayConfigs = [
        {
          key: 'day1',
          title: '11月18日（水）｜1日目',
          subjects: ['論理・表現Ⅰ', '言語文化', 'SS物理']
        },
        {
          key: 'day2',
          title: '11月19日（木）｜2日目',
          subjects: ['SS数学', 'SS生物（生物基礎）']
        },
        {
          key: 'day3',
          title: '11月20日（金）｜3日目',
          subjects: ['現代の国語', '英語コミュニケーションⅠ']
        }
      ];

      dayConfigs.forEach(dayCfg => {
        const dayItems = filtered.filter(i => i.section === dayCfg.key);
        if (dayItems.length === 0) return;

        const dayDone = dayItems.filter(i => i.completed).length;
        let subjectCardsHtml = '';

        dayCfg.subjects.forEach(subj => {
          const subjItems = dayItems.filter(i => i.subject === subj);
          if (subjItems.length === 0) return;

          const subjDone = subjItems.filter(i => i.completed).length;
          subjectCardsHtml += `
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
              <div class="bg-[#eef6fc] border-b border-slate-200 px-3.5 py-2.5 flex items-center justify-between gap-2">
                <h3 class="text-xs sm:text-sm font-extrabold text-[#1b365d]">${escapeHtml(subj)}</h3>
                <span class="text-[11px] font-bold text-[#0077c8] bg-white px-2 py-0.5 rounded-full border border-sky-200 shrink-0">
                  ${subjDone} / ${subjItems.length} 完了
                </span>
              </div>
              <div class="p-2.5 sm:p-3 space-y-2">
                ${subjItems.map(renderTodoRow).join('')}
              </div>
            </div>
          `;
        });

        html += `
          <section class="space-y-2.5">
            <div class="blue-day-banner text-white px-4 py-2.5 rounded-xl font-extrabold text-sm sm:text-base shadow-xs flex items-center justify-between gap-2">
              <span>📅 ${escapeHtml(dayCfg.title)}</span>
              <span class="text-xs font-bold bg-white/20 px-2.5 py-0.5 rounded-full shrink-0">
                ${dayDone} / ${dayItems.length}
              </span>
            </div>
            <div class="space-y-3">
              ${subjectCardsHtml}
            </div>
          </section>
        `;
      });

      container.innerHTML = html;
    }

    /**
     * イベント登録
     */
    function bindEvents() {
      const container = document.getElementById('todo-container');

      container.addEventListener('click', (e) => {
        const delBtn = e.target.closest('.delete-btn');
        if (delBtn) {
          e.stopPropagation();
          const delId = delBtn.getAttribute('data-delete-id');
          todos = todos.filter(item => item.id !== delId);
          saveTodos();
          render();
          showToast('追加した項目を削除しました');
          return;
        }

        const row = e.target.closest('.todo-row');
        if (row) {
          const id = row.getAttribute('data-id');
          const target = todos.find(item => item.id === id);
          if (target) {
            target.completed = !target.completed;
            saveTodos();
            render();
          }
        }
      });

      container.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          const row = e.target.closest('.todo-row');
          if (row) {
            e.preventDefault();
            row.click();
          }
        }
      });

      document.getElementById('filter-tabs').addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;

        activeFilter = btn.getAttribute('data-filter');

        document.querySelectorAll('.filter-btn').forEach(b => {
          const f = b.getAttribute('data-filter');
          if (f === 'submission') {
            b.className = 'filter-btn min-h-[36px] px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-amber-50 text-amber-900 border border-amber-300 hover:bg-amber-100 transition';
          } else {
            b.className = 'filter-btn min-h-[36px] px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-slate-100 text-slate-700 hover:bg-slate-200 transition';
          }
        });

        btn.className = 'filter-btn min-h-[36px] px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-[#0077c8] text-white shadow-xs transition';
        render();
      });

      document.getElementById('add-todo-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const cat = document.getElementById('new-category').value;
        const input = document.getElementById('new-text');
        const cleanedText = input.value.replace(/^[\s\u3000]+|[\s\u3000]+$/g, '');

        if (!cleanedText) {
          showToast('内容を入力してください');
          input.focus();
          return;
        }

        const categoryMap = {
          'submission': { section: 'submission', subject: '追加提出物', badge: '追加提出', badgeStyle: 'urgent' },
          'day1-ronri': { section: 'day1', subject: '論理・表現Ⅰ', badge: '追加TODO', badgeStyle: 'info' },
          'day1-gengo': { section: 'day1', subject: '言語文化', badge: '追記範囲', badgeStyle: 'info' },
          'day1-butsuri': { section: 'day1', subject: 'SS物理', badge: '追加TODO', badgeStyle: 'info' },
          'day2-sugaku': { section: 'day2', subject: 'SS数学', badge: '追加TODO', badgeStyle: 'info' },
          'day2-seibutsu': { section: 'day2', subject: 'SS生物（生物基礎）', badge: '追加TODO', badgeStyle: 'info' },
          'day3-gendaibun': { section: 'day3', subject: '現代の国語', badge: '追加TODO', badgeStyle: 'info' },
          'day3-eigo': { section: 'day3', subject: '英語コミュニケーションⅠ', badge: '追加TODO', badgeStyle: 'info' }
        };

        const meta = categoryMap[cat] || categoryMap['submission'];
        todos.push({
          id: 'custom-' + Date.now(),
          section: meta.section,
          subject: meta.subject,
          badge: meta.badge,
          badgeStyle: meta.badgeStyle,
          text: cleanedText,
          completed: false
        });

        input.value = '';
        saveTodos();
        render();
        showToast('リストに追加しました！');
      });

      const modal = document.getElementById('confirm-modal');
      document.getElementById('reset-btn').addEventListener('click', () => {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      });

      document.getElementById('modal-cancel').addEventListener('click', () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      });

      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        }
      });

      document.getElementById('modal-confirm').addEventListener('click', () => {
        todos = JSON.parse(JSON.stringify(INITIAL_TODOS));
        saveTodos();
        render();
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        showToast('初期状態にリセットしました');
      });

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          updateCountdown();
        }
      });
      window.addEventListener('focus', updateCountdown);
      window.addEventListener('pageshow', updateCountdown);
      setInterval(updateCountdown, 60000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      todos = loadTodos();
      saveTodos();
      updateCountdown();
      bindEvents();
      render();
    });
  </script>
</body>
</html>
