<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカシック・ワークブック</title>
    
    <!-- 絵文字SVGを使った画像不要のホーム画面アイコン設定 -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b0f19'/><text y='75' x='12' font-size='70'>📖</text></svg>">

    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(20, 27, 45, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            
            /* Currencies */
            --litera-color: #ff66cc;    /* Pink */
            --prime-color: #a855f7;     /* Purple */
            --progress-color: #99cc33;  /* Olive Green */
            --legend-color: #eab308;    /* Gold */
            
            /* UI Elements */
            --accent-cyan: #00f3ff;     /* Tap / Active Neon */
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: radial-gradient(circle at top, #1a233a 0%, #0b0f19 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* --- Header: Currencies --- */
        header {
            padding: 16px 12px 12px;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            text-align: center;
            z-index: 10;
        }

        .currency-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .currency-name {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .currency-value {
            font-size: 15px;
            font-weight: 800;
            text-shadow: 0 0 8px currentColor;
        }

        .currency-rate {
            font-size: 9px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .c-litera { color: var(--litera-color); }
        .c-prime { color: var(--prime-color); }
        .c-progress { color: var(--progress-color); }
        .c-legend { color: var(--legend-color); }

        /* --- Main Interactive Zone --- */
        .tap-zone {
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border-color);
        }

        .cheat-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #a855f7, #ff66cc);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 102, 204, 0.5);
            transition: transform 0.1s;
            z-index: 5;
        }
        .cheat-btn:active { transform: scale(0.92); }

        .big-button {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.15) 0%, rgba(11, 15, 25, 0.8) 70%);
            border: 3px solid var(--accent-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.05s, box-shadow 0.1s;
        }

        .big-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.8), inset 0 0 25px rgba(0, 243, 255, 0.5);
        }

        .big-button-text {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        .active-effects-bar {
            margin-top: 12px;
            min-height: 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .effect-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-weight: bold;
        }

        /* --- Navigation Tabs --- */
        nav {
            display: flex;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 0;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }

        .tab-btn.active {
            color: var(--accent-cyan);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 60%;
            height: 3px;
            background: var(--accent-cyan);
            border-radius: 3px 3px 0 0;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        /* --- Content Panels --- */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .panel { display: none; }
        .panel.active { display: block; }

        /* Bulk Controls */
        .bulk-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .bulk-btn {
            flex: 1;
            padding: 8px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-sub);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .bulk-btn.active {
            background: rgba(0, 243, 255, 0.2);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        /* Items / Facilities List */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card-info { flex: 1; }
        .card-title {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-sub {
            font-size: 11px;
            color: var(--text-sub);
        }
        .card-cost {
            font-size: 11px;
            font-weight: 700;
            margin-top: 4px;
        }

        .card-count {
            font-size: 18px;
            font-weight: 900;
            min-width: 45px;
            text-align: right;
            padding-left: 10px;
        }

        .buy-btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            margin-left: 10px;
            transition: opacity 0.2s, transform 0.1s;
        }
        .buy-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .buy-btn:not(:disabled):active { transform: scale(0.95); }

        /* Skill Cards */
        .skill-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .skill-card.is-active {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .skill-progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: var(--accent-cyan);
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        /* Floating Tap Text */
        .click-text {
            position: absolute;
            color: var(--accent-cyan);
            font-size: 16px;
            font-weight: 900;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 6px var(--accent-cyan);
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }

        /* Prestige Panel */
        .prestige-box {
            background: linear-gradient(135deg, rgba(234, 179, 8, 0.1), rgba(11, 15, 25, 0.8));
            border: 1px solid var(--legend-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .prestige-btn {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #000;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.4);
        }
        .prestige-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>

<div id="app">
    <!-- Header: Currencies -->
    <header>
        <div class="currency-card">
            <span class="currency-name c-litera">リテラ</span>
            <span id="val-litera" class="currency-value c-litera">0</span>
            <span id="rate-litera" class="currency-rate">0/s</span>
        </div>
        <div class="currency-card">
            <span class="currency-name c-prime">プライム</span>
            <span id="val-prime" class="currency-value c-prime">0</span>
            <span id="rate-prime" class="currency-rate">0/s</span>
        </div>
        <div class="currency-card">
            <span class="currency-name c-progress">プログレス</span>
            <span id="val-progress" class="currency-value c-progress">0</span>
            <span id="rate-progress" class="currency-rate">0/s</span>
        </div>
        <div class="currency-card">
            <span class="currency-name c-legend">レジェンド (転生)</span>
            <span id="val-legend" class="currency-value c-legend">0</span>
            <span id="rate-boost" class="currency-rate">+0%</span>
        </div>
    </header>

    <!-- Main Tap Zone -->
    <div class="tap-zone" id="tap-zone">
        <button class="cheat-btn" onclick="devCheat()">[DEV] +1M CHEAT</button>
        <div class="big-button" id="main-tap-btn">
            <span class="big-button-text">勉強</span>
        </div>
        <div class="active-effects-bar" id="active-effects-bar"></div>
    </div>

    <!-- Navigation Tabs -->
    <nav>
        <button class="tab-btn active" onclick="switchTab('facilities')">参考書 (12)</button>
        <button class="tab-btn" onclick="switchTab('skills')">効率化 (8)</button>
        <button class="tab-btn" onclick="switchTab('prestige')">転生</button>
    </nav>

    <!-- Content Area -->
    <div class="content-area">
        <!-- Facilities Panel -->
        <div id="panel-facilities" class="panel active">
            <div class="bulk-bar">
                <button class="bulk-btn active" onclick="setBulk(1, this)">x1</button>
                <button class="bulk-btn" onclick="setBulk(10, this)">x10</button>
                <button class="bulk-btn" onclick="setBulk(100, this)">x100</button>
                <button class="bulk-btn" onclick="setBulk('MAX', this)">MAX</button>
            </div>
            <div class="card-list" id="facilities-list"></div>
        </div>

        <!-- Skills Panel -->
        <div id="panel-skills" class="panel">
            <div class="card-list" id="skills-list"></div>
        </div>

        <!-- Prestige Panel -->
        <div id="panel-prestige" class="panel">
            <div class="prestige-box">
                <h3 style="color: var(--legend-color); margin-bottom: 8px;">叡智の継承（転生）</h3>
                <p style="font-size: 12px; color: var(--text-sub); line-height: 1.5;">
                    すべての参考書と通常通貨をリセットし、<b>レジェンドポイント</b>を獲得します。<br>
                    1 レジェンドポイントにつき<b>全生産力が +100% 永続ブースト</b>されます。
                </p>
                <div style="margin: 16px 0;">
                    <div style="font-size: 13px;">獲得可能レジェンド: <b id="pending-legend" class="c-legend" style="font-size: 18px;">+0</b></div>
                    <div style="font-size: 11px; color: var(--text-sub); margin-top: 4px;">(必要累計リテラ: 1.00M〜)</div>
                </div>
                <button id="prestige-btn" class="prestige-btn" onclick="doPrestige()" disabled>転生を実行する</button>
            </div>
        </div>
    </div>
</div>

<script>
// --- Game State & Data ---
const state = {
    litera: 0,
    prime: 0,
    progress: 0,
    legend: 0,
    totalLiteraEarned: 0,
    bulk: 1,
    facilities: Array(12).fill(0),
    skillCooldowns: {},
    activeSkills: {}
};

// Facility Definitions (12 Books)
const FACILITIES = [
    // Litera (Pink)
    { id: 0, name: "ターゲット1900", currency: "litera", baseCost: 15, baseProd: 1, color: "var(--litera-color)" },
    { id: 1, name: "ビジョンクエスト", currency: "litera", baseCost: 100, baseProd: 8, color: "var(--litera-color)" },
    { id: 2, name: "アルティメット", currency: "litera", baseCost: 1100, baseProd: 47, color: "var(--litera-color)" },
    { id: 3, name: "東大英語", currency: "litera", baseCost: 12000, baseProd: 260, color: "var(--litera-color)" },
    // Prime (Purple)
    { id: 4, name: "白チャート", currency: "prime", baseCost: 15, baseProd: 1, color: "var(--prime-color)" },
    { id: 5, name: "黄チャート", currency: "prime", baseCost: 100, baseProd: 8, color: "var(--prime-color)" },
    { id: 6, name: "青チャート", currency: "prime", baseCost: 1100, baseProd: 47, color: "var(--prime-color)" },
    { id: 7, name: "赤チャート", currency: "prime", baseCost: 12000, baseProd: 260, color: "var(--prime-color)" },
    // Progress (Olive Green)
    { id: 8, name: "古文単語345", currency: "progress", baseCost: 15, baseProd: 1, color: "var(--progress-color)" },
    { id: 9, name: "明快古典文法", currency: "progress", baseCost: 100, baseProd: 8, color: "var(--progress-color)" },
    { id: 10, name: "ちくま小説選", currency: "progress", baseCost: 1100, baseProd: 47, color: "var(--progress-color)" },
    { id: 11, name: "名問の森", currency: "progress", baseCost: 12000, baseProd: 260, color: "var(--progress-color)" }
];

// 8 Efficiency Skills
const SKILLS = [
    { id: 0, name: "集中暗記", costCurrency: "litera", cost: 50, duration: 10, type: "clickBoost", power: 5, desc: "10秒間、タップ獲得量が 5倍 に上昇" },
    { id: 1, name: "高速計算", costCurrency: "prime", cost: 50, duration: 10, type: "prodBoost", power: 5, desc: "10秒間、全生産力が 5倍 にブースト" },
    { id: 2, name: "文脈理解", costCurrency: "progress", cost: 50, duration: 10, type: "timeSkip", power: 30, desc: "即座に 30秒分 の生産報酬を獲得" },
    { id: 3, name: "模擬試験", costCurrency: "litera", cost: 500, duration: 15, type: "clickBoost", power: 20, desc: "15秒間、タップ獲得量が 20倍 に上昇" },
    { id: 4, name: "解法パターン化", costCurrency: "prime", cost: 500, duration: 15, type: "prodBoost", power: 20, desc: "15秒間、全生産力が 20倍 にブースト" },
    { id: 5, name: "全神貫注", costCurrency: "progress", cost: 500, duration: 15, type: "timeSkip", power: 120, desc: "即座に 2分分 の生産報酬を獲得" },
    { id: 6, name: "ゾーン突入", costCurrency: "litera", cost: 5000, duration: 20, type: "allBoost", power: 50, desc: "20秒間、全ての生産とタップが 50倍" },
    { id: 7, name: "アカシック領域", costCurrency: "legend", cost: 1, duration: 20, type: "allBoost", power: 200, desc: "20秒間、全ての生産とタップが 200倍" }
];

// --- Safe Formatter ---
function format(num) {
    if (!isFinite(num) || isNaN(num) || num === null || num === undefined) return "0";
    if (num < 0) return "0";
    if (num < 1000) return num.toFixed(0);
    
    const suffixes = ["", "k", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
    const i = Math.floor(Math.log10(num) / 3);
    if (i >= suffixes.length) return num.toExponential(2);
    
    const formatted = (num / Math.pow(10, i * 3)).toFixed(2);
    return `${formatted}${suffixes[i]}`;
}

// --- Calculation Core ---
function getGlobalBoost() {
    let boost = 1 + (state.legend * 1.0); // +100% per legend point
    
    // Skill boosters
    for (const [id, timer] of Object.entries(state.activeSkills)) {
        if (timer > 0) {
            const sk = SKILLS[id];
            if (sk.type === "prodBoost" || sk.type === "allBoost") {
                boost *= sk.power;
            }
        }
    }
    return boost;
}

function getTapPower() {
    let base = 1;
    let clickBoost = 1;
    
    for (const [id, timer] of Object.entries(state.activeSkills)) {
        if (timer > 0) {
            const sk = SKILLS[id];
            if (sk.type === "clickBoost" || sk.type === "allBoost") {
                clickBoost *= sk.power;
            }
        }
    }
    return base * clickBoost * getGlobalBoost();
}

function getProductionRates() {
    const rates = { litera: 0, prime: 0, progress: 0 };
    const boost = getGlobalBoost();
    
    FACILITIES.forEach(fac => {
        const count = state.facilities[fac.id] || 0;
        if (count > 0) {
            rates[fac.currency] += fac.baseProd * count * boost;
        }
    });
    
    return rates;
}

// Geometric Series Cost Calculation
function getBulkCost(fac, amount) {
    const current = state.facilities[fac.id] || 0;
    const r = 1.15;
    
    if (amount === "MAX") {
        const userBalance = state[fac.currency] || 0;
        if (userBalance < fac.baseCost * Math.pow(r, current)) {
            return { count: 1, cost: fac.baseCost * Math.pow(r, current) };
        }
        let n = Math.floor(Math.log(1 + (userBalance * (r - 1)) / (fac.baseCost * Math.pow(r, current))) / Math.log(r));
        n = Math.max(1, n);
        const cost = fac.baseCost * (Math.pow(r, current) * (Math.pow(r, n) - 1)) / (r - 1);
        return { count: n, cost: cost };
    } else {
        const n = amount;
        const cost = fac.baseCost * (Math.pow(r, current) * (Math.pow(r, n) - 1)) / (r - 1);
        return { count: n, cost: cost };
    }
}

// --- UI Rendering ---
function renderUI() {
    // Header Currencies
    document.getElementById("val-litera").textContent = format(state.litera);
    document.getElementById("val-prime").textContent = format(state.prime);
    document.getElementById("val-progress").textContent = format(state.progress);
    document.getElementById("val-legend").textContent = format(state.legend);

    const rates = getProductionRates();
    document.getElementById("rate-litera").textContent = `${format(rates.litera)}/s`;
    document.getElementById("rate-prime").textContent = `${format(rates.prime)}/s`;
    document.getElementById("rate-progress").textContent = `${format(rates.progress)}/s`;
    document.getElementById("rate-boost").textContent = `+${format(state.legend * 100)}%`;

    // Render Active Effects Bar
    const effectsBar = document.getElementById("active-effects-bar");
    effectsBar.innerHTML = "";
    for (const [id, timer] of Object.entries(state.activeSkills)) {
        if (timer > 0) {
            const sk = SKILLS[id];
            const badge = document.createElement("div");
            badge.className = "effect-badge";
            badge.textContent = `${sk.name} (${Math.ceil(timer)}s)`;
            effectsBar.appendChild(badge);
        }
    }

    // Render Facilities
    const facList = document.getElementById("facilities-list");
    facList.innerHTML = "";
    FACILITIES.forEach(fac => {
        const count = state.facilities[fac.id] || 0;
        const { count: buyCount, cost } = getBulkCost(fac, state.bulk);
        const canBuy = (state[fac.currency] >= cost);

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <div class="card-info">
                <div class="card-title" style="color: ${fac.color}">${fac.name} <span style="font-size:10px; opacity:0.8;">(+${format(fac.baseProd)}/s)</span></div>
                <div class="card-cost" style="color: ${canBuy ? 'var(--text-main)' : 'var(--text-sub)'}">
                    Cost: ${format(cost)} ${fac.currency.toUpperCase()} (${state.bulk === 'MAX' ? 'x' + buyCount : 'x' + state.bulk})
                </div>
            </div>
            <div class="card-count" style="color: ${fac.color}">${count}</div>
            <button class="buy-btn" style="background: ${fac.color}; color: #000;" ${canBuy ? '' : 'disabled'} onclick="buyFacility(${fac.id})">
                購入
            </button>
        `;
        facList.appendChild(card);
    });

    // Render Skills
    const skillList = document.getElementById("skills-list");
    skillList.innerHTML = "";
    SKILLS.forEach(sk => {
        const isActive = (state.activeSkills[sk.id] || 0) > 0;
        const activeTimer = state.activeSkills[sk.id] || 0;
        const canAfford = (state[sk.costCurrency] >= sk.cost);

        const card = document.createElement("div");
        card.className = `skill-card ${isActive ? 'is-active' : ''}`;
        
        let pct = 0;
        if (isActive) {
            pct = (activeTimer / sk.duration) * 100;
        }

        card.innerHTML = `
            <div class="card-info">
                <div class="card-title" style="color: var(--accent-cyan)">
                    ${sk.name} 
                    ${isActive ? `<span style="font-size:10px; color:var(--accent-cyan);">効果発動中 (${Math.ceil(activeTimer)}s)</span>` : ''}
                </div>
                <div class="card-sub">${sk.desc}</div>
                <div class="card-cost" style="margin-top:4px;">Cost: ${format(sk.cost)} ${sk.costCurrency.toUpperCase()}</div>
            </div>
            <button class="buy-btn" style="background: var(--accent-cyan); color: #000;" ${(!isActive && canAfford) ? '' : 'disabled'} onclick="useSkill(${sk.id})">
                ${isActive ? '発動中' : '発動'}
            </button>
            <div class="skill-progress-bar" style="width: ${pct}%"></div>
        `;
        skillList.appendChild(card);
    });

    // Prestige Update
    const pendingLegend = Math.floor(Math.pow(state.totalLiteraEarned / 1e6, 0.5));
    document.getElementById("pending-legend").textContent = `+${format(pendingLegend)}`;
    document.getElementById("prestige-btn").disabled = (pendingLegend <= 0);
}

// --- User Actions ---
function tap(e) {
    const power = getTapPower();
    state.litera += power;
    state.totalLiteraEarned += power;

    const rect = e.target.getBoundingClientRect();
    const x = e.clientX || (rect.left + rect.width / 2);
    const y = e.clientY || (rect.top + rect.height / 2);

    const txt = document.createElement("div");
    txt.className = "click-text";
    txt.textContent = `+${format(power)}`;
    txt.style.left = `${x - 15}px`;
    txt.style.top = `${y - 20}px`;
    document.body.appendChild(txt);

    setTimeout(() => txt.remove(), 800);
    renderUI();
}

function buyFacility(id) {
    const fac = FACILITIES[id];
    const { count, cost } = getBulkCost(fac, state.bulk);
    
    if (state[fac.currency] >= cost) {
        state[fac.currency] -= cost;
        state.facilities[id] = (state.facilities[id] || 0) + count;
        renderUI();
    }
}

function useSkill(id) {
    const sk = SKILLS[id];
    if ((state.activeSkills[id] || 0) <= 0 && state[sk.costCurrency] >= sk.cost) {
        state[sk.costCurrency] -= sk.cost;

        if (sk.type === "timeSkip") {
            const rates = getProductionRates();
            state.litera += rates.litera * sk.power;
            state.prime += rates.prime * sk.power;
            state.progress += rates.progress * sk.power;
            state.totalLiteraEarned += rates.litera * sk.power;
        } else {
            state.activeSkills[id] = sk.duration;
        }
        renderUI();
    }
}

function doPrestige() {
    const pending = Math.floor(Math.pow(state.totalLiteraEarned / 1e6, 0.5));
    if (pending > 0) {
        state.legend += pending;
        state.litera = 0;
        state.prime = 0;
        state.progress = 0;
        state.facilities = Array(12).fill(0);
        state.activeSkills = {};
        renderUI();
    }
}

function setBulk(val, btn) {
    state.bulk = val;
    document.querySelectorAll(".bulk-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderUI();
}

function switchTab(tabId) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    
    event.target.classList.add("active");
    document.getElementById(`panel-${tabId}`).classList.add("active");
}

function devCheat() {
    state.litera += 1000000;
    state.prime += 1000000;
    state.progress += 1000000;
    state.totalLiteraEarned += 1000000;
    renderUI();
}

// --- Main Loop ---
let lastTime = performance.now();
function gameLoop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    // Production Tick
    const rates = getProductionRates();
    state.litera += rates.litera * dt;
    state.prime += rates.prime * dt;
    state.progress += rates.progress * dt;
    state.totalLiteraEarned += rates.litera * dt;

    // Skill Timers
    for (const [id, timer] of Object.entries(state.activeSkills)) {
        if (timer > 0) {
            state.activeSkills[id] = Math.max(0, timer - dt);
        }
    }

    renderUI();
    requestAnimationFrame(gameLoop);
}

// Init
document.getElementById("main-tap-btn").addEventListener("click", tap);
renderUI();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
